name: Lightwell Scan

# Scan only: show proposed Lightwell pom bumps. Does not open a PR.
on:
  workflow_dispatch:
  push:
    paths:
      - "**/pom.xml"
      - "lightwell-github/catalog.json"
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: read
  issues: write

jobs:
  scan:
    name: Scan for Lightwell remediations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan pom.xml files
        id: scan
        run: |
          python3 lightwell-github/scan_poms.py --root .
          MATCH_COUNT=$(python3 -c 'import json; print(len(json.load(open("lightwell-github/out/matches.json"))["matches"]))')
          echo "match_count=$MATCH_COUNT" >> "$GITHUB_OUTPUT"

      - name: Write job summary
        run: |
          cat lightwell-github/out/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update Lightwell issue
        if: steps.scan.outputs.match_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TITLE="Lightwell remediations available"
          BODY_FILE=lightwell-github/out/report.md

          EXISTING=$(gh issue list --label lightwell --state open --json number,title \
            --jq ".[] | select(.title==\"$TITLE\") | .number" | head -n1)

          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body-file "$BODY_FILE"
            echo "Updated issue #$EXISTING"
          else
            gh label create lightwell --description "Lightwell remediation proposals" --color "0E4429" || true
            gh issue create --title "$TITLE" --label lightwell --body-file "$BODY_FILE"
          fi

      - name: No matches
        if: steps.scan.outputs.match_count == '0'
        run: echo "No Lightwell remediations to propose."
