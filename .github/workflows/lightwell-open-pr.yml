name: Lightwell Open PR

# Button-only: developer reviews scan info first, then runs this workflow to open a PR.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type open-pr to confirm creating the pull request'
        required: true
        default: ''
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  open-pr:
    name: Apply bumps and open PR
    runs-on: ubuntu-latest
    steps:
      - name: Confirm intent
        run: |
          if [ "${{ inputs.confirm }}" != "open-pr" ]; then
            echo "::error::Refusing to open PR. Set confirm input to exactly: open-pr"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan pom.xml files
        id: scan
        run: |
          python3 lightwell-github/scan_poms.py --root .
          MATCH_COUNT=$(python3 -c 'import json; print(len(json.load(open("lightwell-github/out/matches.json"))["matches"]))')
          echo "match_count=$MATCH_COUNT" >> "$GITHUB_OUTPUT"
          cat lightwell-github/out/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Stop if nothing to remediate
        if: steps.scan.outputs.match_count == '0'
        run: echo "::notice::No matching Lightwell remediations. Nothing to open."

      - name: Apply version bumps
        if: steps.scan.outputs.match_count != '0'
        run: python3 lightwell-github/apply_bumps.py --root .

      - name: Create branch, commit, and open PR
        if: steps.scan.outputs.match_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          SHORT_SHA=$(git rev-parse --short HEAD)
          BRANCH="lightwell/remediate-${SHORT_SHA}"

          TITLE=$(python3 - <<'PY'
          import json
          matches = json.load(open("lightwell-github/out/matches.json"))["matches"]
          if len(matches) == 1:
              m = matches[0]
              print(f"chore(deps): remediate {m['artifactId']} to {m['toVersion']} (Lightwell)")
          else:
              print(f"chore(deps): remediate {len(matches)} dependencies to Lightwell builds")
          PY
          )

          {
            echo "## Summary"
            echo
            echo "Automated Lightwell library remediations applied after explicit developer confirmation."
            echo
            cat lightwell-github/out/report.md
            echo
            echo "## Test plan"
            echo
            echo "- [ ] Review pom.xml version bumps"
            echo "- [ ] Run \`mvn -f payments-service-demo/pom.xml -q test\` (or project build)"
            echo "- [ ] Confirm Lightwell artifacts resolve in CI"
          } > /tmp/pr-body.md

          mapfile -t POMS < <(python3 -c 'import json; print("\n".join(m["pom"] for m in json.load(open("lightwell-github/out/matches.json"))["matches"]))')

          git config user.name "lightwell-bot"
          git config user.email "lightwell-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add "${POMS[@]}"

          if git diff --cached --quiet; then
            echo "::error::No pom changes staged after apply."
            exit 1
          fi

          git commit -m "$TITLE"
          git push -u origin HEAD

          PR_URL=$(gh pr create --title "$TITLE" --body-file /tmp/pr-body.md)
          echo "Opened PR: $PR_URL"

          ISSUE=$(gh issue list --label lightwell --state open --json number,title \
            --jq '.[] | select(.title=="Lightwell remediations available") | .number' | head -n1 || true)
          if [ -n "${ISSUE:-}" ]; then
            gh issue comment "$ISSUE" --body "Pull request opened: $PR_URL"
          fi
